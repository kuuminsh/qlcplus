<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>QLC+ Studio</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<header class="topbar">
  <div class="brand">QLC+ <span>Studio</span></div>
  <div class="conn" id="conn" data-state="off"><span class="dot"></span><span id="connText"></span></div>
  <div class="spacer"></div>
  <label class="toggle" id="soloLabel"><input type="checkbox" id="soloMode" checked><span id="soloText"></span></label>
  <button class="btn" id="saveBtn" disabled></button>
</header>

<main class="layout">
  <aside class="sidebar">
    <input type="search" id="filter" class="filter" autocomplete="off">
    <div id="sceneList" class="scene-list"></div>
  </aside>

  <section class="editor" id="editor">
    <div class="empty" id="emptyMsg"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script src="studio.js"></script>
</body>
</html>
